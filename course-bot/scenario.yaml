screens:
  welcome:
    photo: media/welcome.jpg
    text: |
      приветик!

      это – персональный курс по эстетичному контенту Как искусство ✨

      теперь всё самое нужное и важное собрано в одной версии курса, которую ты можешь пройти в записи – в своём темпе, возвращаясь к урокам и практикам тогда, когда тебе удобно

      здесь я собрала всё, чтобы помочь тебе находить идеи для съёмок, создавать эстетичный и цепляющий контент, выстраивать собственный визуальный стиль и уверенно вести свой блог

      что внутри?
      – 15 уроков и практических заданий
      – контент-задания, которые можно сразу снимать и публиковать
      – банк идей и референсов, чтобы всегда знать, что снять
      – материалы для твоего контента

      можешь познакомиться с подробным содержанием и отзывами или сразу забрать весь курс 🤍
    on_enter:
      add:
      - lead
    buttons:
    - - text: подробное содержание
        goto: contents
    - - text: отзывы
        goto: reviews
    - - text: забрать весь курс
        goto: buy
  contents:
    photo: media/contents.jpg
    text: |
      Что тебя ждёт внутри?

      • 4 модуля и 15 уроков – видео по 30–50 минут и задания к ним

      • личный кабинет – чтобы ничего не потерялось и все материалы всегда были под рукой

      • канал для вдохновения – с идеями, референсами и полезными материалами

      • практика и задания в рабочей тетради – чтобы сразу применять знания в своём контенте

      • банк идей и готовые контент-задания – чтобы всегда знать, что снять и как воплотить свои задумки

      после курса у тебя будут не только новые знания и навыки, но и полноценная лента из твоего контента, которую можно сразу публиковать 🤎

      все уроки и материалы доступны тебе навсегда!
    buttons:
    - - text: подробнее про модули
        goto: module1
    - &id001
      - text: забрать курс
        goto: buy
  module1:
    photo: media/module1.jpg
    text: |
      <b>Модуль 1: Система визуал &amp; смыслы блога</b>

      <b>Урок 1. Эстетика и визуальный стиль</b>
      — что такое эстетика блога
      — как визуал связан с образом жизни
      — визуальные атрибуты вашего стиля
      — актуальные тренды визуала
      — типы эстетик блогов
      — как найти свою эстетику

      <b>Урок 1.1. Сезонные эстетики и тренды</b>
      — какие элементы сезона добавить в свои съемки, чтобы кадры попадали в рекомендации

      <b>Урок 2. Темы блога</b>
      — о чем можно говорить
      — как сочетать эстетику и экспертность

      <b>Урок 3. Стратегия контента в блоге: как совмещать и продвигаться</b>
      — основные форматы контента в блоге
      — баланс визуального и смыслового контента
      — структура гармоничного блога

      <b>Урок 4. Контент-спринты</b>
      как способ комфортного продвижения 2026
    buttons:
    - - text: ко второму модулю
        goto: module2
    - *id001
  module2:
    photo: media/module2.jpg
    text: |
      <b>Модуль 2: Визуальный язык кадра</b>
      Разбираем и изучаем базу визуальной грамотности.
      После него вы начнёте снимать кадры, которые выглядят профессионально.

      <b>Урок 5: Теория и практика цвета, как стильно сочетать цвета в кадре</b>
      – психология и смысл цвета
      – сочетания цветов
      – цветовые контрасты
      – цветовая гармония в кадре
      – как использовать цвет для усиления эстетики

      <b>Урок 6: Как качественно снимать с любым видом освещения</b>
      – как работает свет
      – естественный свет в съёмке
      – как улучшить качество кадра
      – распространённые ошибки освещения
      – создание объёма и атмосферы

      <b>Урок 7. Как видеть ракурсы, композиция и планы</b>
      – правила композиции
      – баланс элементов в кадре
      – работа с пространством
      – ракурсы, которые делают кадр интереснее
      – динамика в фото и видео

      <b>Урок 8. Обработка фото и видео</b>
      – отбор исходников
      – параметры обработки
      – составление ленты
    buttons:
    - - text: к третьему модулю
        goto: module3
    - *id001
  module3:
    photo: media/module3.jpg
    text: |
      <b>Модуль 3. Креатив и идеи для контента</b>
      Этот модуль помогает развить визуальное мышление и научиться находить идеи для контента

      <b>Урок 9. Насмотренность и поиск визуальных идей</b>
      – как формируется насмотренность
      – работа с референсами
      – где искать идеи для контента
      – как адаптировать тренды под свой стиль

      <b>Урок 10. Карусели как формат визуального сторителлинга</b>
      – структура сильной карусели
      – сочетание текста и визуала
      – идеи каруселей для блога

      <b>Урок 11. Съемка рилс</b>
      – форматы рилс
      – как привлекать и удерживать внимание
      – продвижение через рилс
    buttons:
    - - text: к четвёртому модулю
        goto: module4
    - *id001
  module4:
    photo: media/module4.jpg
    text: |
      <b>Модуль 4: Практика съёмки</b>
      В последнем модуле тебя ожидают уроки практики, на которых мы будем использовать знания с прошлых модулей в реальных съемках

      <b>В уроках 12–14 мы изучим:</b>
      – поиск локаций
      – подготовка к съемкам: идея, образ, что взять с собой
      – съемки для разных задач и форматов контента
      – работа с UGC-контентом для брендов
      – быстрая съемка в людных местах
      – лайфхаки и советы по работе со штативом, съемке селфи
      – как провести инструктаж парню/мужу/подруге

      <b>Урок 15. Визуальные триггеры и сборка визуальной системы</b>
      – что делает блог узнаваемым
      – визуальные триггеры
      – повторяемость элементов
      – как собрать единый визуальный стиль
      – система визуального контента
    buttons:
    - - text: отзывы
        goto: reviews
    - *id001
  reviews:
    photo: media/reviews.jpg
    text: |
      сверху я показываю лишь часть отзывов с прошлых потоков, а другие реальные отзывы ты можешь почитать по кнопке ниже
    buttons:
