# ============================================================
#  СЦЕНАРИЙ БОТА «Как искусство»
#  Тариф: label — название в боте; title — наименование в чеке Prodamus
#  («Категория: Наименование» по 54-ФЗ); paid_content — «доступы к материалам».
#  После правки: git pull на сервере и /reload в боте (от админа).
#
#  Экран: photo (файл из media/ или URL), text (HTML: <b>, <i>, <s>, <a href="">),
#  buttons — список рядов; кнопка: goto: экран | url: ссылка | pay: тариф,
#  необязательно if: {any|all|not: [категории]}.
#  Лимит текста: 1024 символа с картинкой, 4096 без неё.
# ============================================================

